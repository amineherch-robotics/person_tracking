# Parametres communs a tous les nodes du projet en mode robot reel (EF-11, ENF-02).
# Image WiFi en compressed, QoS best effort (section 5 du CdC).
/**:
  ros__parameters:
    use_sim_time: false
    image_topic: /image_raw
    image_transport: compressed
    camera_info_topic: /camera_info
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    base_frame: base_footprint

# --- Phase 1 : detection couleur d'une balle de tennis (jaune-vert fluo, 6.7 cm) ---
detector_node:
  ros__parameters:
    backend: color
    class_id: tennis_ball
    # A regler sur des images reelles (eclairage) : voir docs/rapport_avancement.md
    # [h_min, s_min, v_min, h_max, s_max, v_max] (H OpenCV 0-180), plusieurs intervalles possibles
    hsv_ranges: [25, 80, 100, 45, 255, 255]
    min_area: 40.0            # px ; balle de 6.7 cm a 2 m ~ 180 px
    max_detections: 1

target_selector_node:
  ros__parameters:
    object_height: 0.067      # m, diametre d'une balle de tennis (6.54 a 6.86 cm)
    lost_timeout: 2.0
    camera_hfov: 1.2217       # rad, utilise si la webcam n'est pas calibree

follower_controller:
  ros__parameters:
    start_enabled: false      # SEC-05 : activation explicite avec estop_keyboard (touche g)
    control_rate: 20.0
    watchdog_timeout: 0.3     # s : arret total < 0.5 s apres la derniere image (SEC-01)
    k_angular: 1.2
    k_linear: 0.5
    distance_setpoint: 1.0
    angular_deadband: 0.03
    distance_deadband: 0.05
    max_linear: 0.15
    max_angular: 1.0
    max_linear_accel: 0.3
    max_angular_accel: 2.0
    min_distance: 0.5
    max_reverse: 0.0          # m/s ; ex. 0.05 pour reculer quand la cible avance (decision en attente)
