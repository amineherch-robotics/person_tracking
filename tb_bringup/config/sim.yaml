# Parametres communs a tous les nodes du projet en mode simulation (EF-11, ENF-02).
# Les parametres propres a chaque node (seuils, gains) seront ajoutes au fil des phases.
/**:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/image_raw
    image_transport: raw
    camera_info_topic: /camera/camera_info
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    base_frame: base_footprint

# --- Phase 1 : detection couleur d'une balle de tennis (jaune-vert fluo, 6.7 cm) ---
detector_node:
  ros__parameters:
    backend: color
    class_id: tennis_ball
    # Mesure en sim : balle H 32-34 ; t-shirt de la personne H 50-59, V <= 102 ; boite H 11-17
    # [h_min, s_min, v_min, h_max, s_max, v_max] (H OpenCV 0-180), plusieurs intervalles possibles
    hsv_ranges: [25, 80, 100, 45, 255, 255]
    min_area: 40.0            # px ; balle de 6.7 cm a 2 m ~ 180 px
    max_detections: 1

target_selector_node:
  ros__parameters:
    object_height: 0.067      # m, diametre d'une balle de tennis
    lost_timeout: 2.0         # s (EF-04 / EF-07)

follower_controller:
  ros__parameters:
    start_enabled: true       # en simulation seulement
    control_rate: 20.0
    watchdog_timeout: 0.3     # s : arret total < 0.5 s apres la derniere image (SEC-01)
    k_angular: 1.2
    k_linear: 0.5
    distance_setpoint: 1.0    # m (EF-06)
    angular_deadband: 0.03
    distance_deadband: 0.05
    max_linear: 0.15          # m/s (SEC-02)
    max_angular: 1.0          # rad/s (SEC-02)
    max_linear_accel: 0.3     # m/s^2 (SEC-03)
    max_angular_accel: 2.0    # rad/s^2 (SEC-03)
    min_distance: 0.5         # m (SEC-04)
    max_reverse: 0.0          # m/s ; ex. 0.05 pour reculer quand la cible avance (decision en attente)
